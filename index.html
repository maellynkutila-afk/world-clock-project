<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment-with-locales.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.6/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clocks</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clocks</h1>
      <select id="list-of-cities">
        <option value="">-- Select a city --</option>
        <option value="current-location">My current location</option>
        <option value="Europe/Paris">Paris</option>
        <option value="America/New_York">New York</option>
        <option value="Africa/Kinshasa">Kinshasa</option>
        <option value="Asia/Seoul">Seoul</option>
        <option value="Pacific/Auckland">Auckland</option>
      </select>
      <div id="by-default">
        <div class="city" id="rio-brazil">
          <h2 class="rio">Rio de Janeiro</h2>
          <div class="date">Tuesday November 3, 2026</div>
          <div class="time">19:27:30</div>
        </div>

        <div class="city" id="beijing-china">
          <h2 class="beijing">Beijing</h2>
          <div class="date">Tuesday November 3, 2026</div>
          <div class="time">19:27:30</div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded by
      <a href="https://github.com/maellynkutila-afk" target="_blank">
        Maelly Barbier</a
      >
      and is
      <a
        href="https://github.com/maellynkutila-afk/world-clock-project"
        target="_blank"
        >on GitHub</a
      >.
    </footer>
    <script src="script.js"></script>
  </body>
</html>
